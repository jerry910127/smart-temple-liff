<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <linearGradient id="cylinderBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c5828"/>
      <stop offset="25%" stop-color="#b88350"/>
      <stop offset="65%" stop-color="#dca574"/>
      <stop offset="90%" stop-color="#a66e3b"/>
      <stop offset="100%" stop-color="#734218"/>
    </linearGradient>
    <linearGradient id="rimShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#46250a"/>
      <stop offset="100%" stop-color="#1f0f04"/>
    </linearGradient>
    <filter id="cylShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1a1512" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 籤筒內部露出之竹籤叢 -->
  <g opacity="0.95">
    <rect x="75" y="40" width="9" height="110" rx="3" fill="#e8c79a" transform="rotate(-12 75 140)"/>
    <rect x="90" y="32" width="10" height="120" rx="3" fill="#f4dab3" transform="rotate(-6 90 140)"/>
    <rect x="108" y="25" width="10" height="125" rx="3" fill="#dfbe8e" transform="rotate(2 108 140)"/>
    <rect x="125" y="30" width="10" height="120" rx="3" fill="#ebd0a7" transform="rotate(8 125 140)"/>
    <rect x="142" y="42" width="9" height="110" rx="3" fill="#ddb885" transform="rotate(15 142 140)"/>
    <!-- 紅頭標籤 -->
    <rect x="108" y="25" width="10" height="24" rx="2" fill="#a83232" transform="rotate(2 108 140)"/>
    <rect x="90" y="32" width="10" height="22" rx="2" fill="#a83232" transform="rotate(-6 90 140)"/>
  </g>

  <!-- 筒口內圈暗面 -->
  <ellipse cx="120" cy="110" rx="75" ry="18" fill="url(#rimShade)"/>

  <!-- 籤筒主體 (六角榫接原木桶身) -->
  <path d="M 45 110 
           L 58 290 
           C 58 305, 182 305, 182 290 
           L 195 110 Z" 
        fill="url(#cylinderBody)" 
        filter="url(#cylShadow)"/>

  <!-- 筒口上緣外圈 -->
  <ellipse cx="120" cy="110" rx="75" ry="16" fill="none" stroke="#e0af80" stroke-width="3"/>

  <!-- 銅箍飾圈 (日式精工) -->
  <path d="M 49 145 C 80 158, 160 158, 191 145" fill="none" stroke="#483220" stroke-width="3.5" stroke-opacity="0.8"/>
  <path d="M 55 255 C 85 268, 155 268, 185 255" fill="none" stroke="#483220" stroke-width="3.5" stroke-opacity="0.8"/>

  <!-- 簡約燙金「福運」銘牌 -->
  <rect x="94" y="175" width="52" height="60" rx="4" fill="#2d1c13" stroke="#c29b62" stroke-width="1.5"/>
  <text x="120" y="200" font-family="'Noto Serif TC', 'PingFang TC', serif" font-size="14" font-weight="bold" fill="#f4dab3" text-anchor="middle" letter-spacing="2">福運</text>
  <text x="120" y="222" font-family="'Noto Serif TC', 'PingFang TC', serif" font-size="14" font-weight="bold" fill="#c29b62" text-anchor="middle" letter-spacing="2">靈籤</text>
</svg>