<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <g transform="translate(10, -10) rotate(-22 100 110)">
    
  <defs>
    <!-- 木質漸層 -->
    <linearGradient id="cypressWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d69f6e"/>
      <stop offset="30%" stop-color="#b07d4b"/>
      <stop offset="70%" stop-color="#8b572a"/>
      <stop offset="100%" stop-color="#673915"/>
    </linearGradient>
    <!-- 圓弧立體高光 -->
    <linearGradient id="ridgeHighlight" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#2a1608" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 凸面半月筊身 -->
  <path d="M 80 15 
           C 135 45, 145 150, 105 235 
           C 95 250, 80 252, 75 238 
           C 50 170, 48 85, 80 15 Z" 
        fill="url(#cypressWood)" 
        filter="url(#softShadow)"/>

  <!-- 筊背立體脊線與高光 -->
  <path d="M 80 15 
           C 118 60, 120 160, 90 236
           C 85 240, 78 238, 75 230
           C 60 160, 62 80, 80 15 Z" 
        fill="url(#ridgeHighlight)"/>

  <!-- 檜木年輪細紋 -->
  <path d="M 75 45 C 105 70, 115 120, 95 180" stroke="#522b0c" stroke-width="1.2" stroke-opacity="0.25" fill="none"/>
  <path d="M 70 80 C 95 105, 105 145, 90 195" stroke="#522b0c" stroke-width="1" stroke-opacity="0.2" fill="none"/>
  <path d="M 78 30 C 95 50, 102 90, 88 140" stroke="#fff" stroke-width="1.2" stroke-opacity="0.25" fill="none"/>

  </g>
  <g transform="translate(145, 10) rotate(35 100 110)">
    
  <defs>
    <!-- 平面內斂深赭檜木 -->
    <linearGradient id="flatWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b88354"/>
      <stop offset="50%" stop-color="#935f32"/>
      <stop offset="100%" stop-color="#6f4019"/>
    </linearGradient>
    <radialGradient id="innerShade" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.28"/>
    </radialGradient>
    <filter id="softShadow2" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#2a1608" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 平切半月身 -->
  <path d="M 80 15 
           C 135 45, 145 150, 105 235 
           C 95 250, 80 252, 75 238 
           C 50 170, 48 85, 80 15 Z" 
        fill="url(#flatWood)" 
        filter="url(#softShadow2)"/>

  <!-- 剖面內斂邊緣陰影 (表現平整切面) -->
  <path d="M 80 15 
           C 135 45, 145 150, 105 235 
           C 95 250, 80 252, 75 238 
           C 50 170, 48 85, 80 15 Z" 
        fill="url(#innerShade)"/>

  <!-- 禪意剖面同心木紋 -->
  <path d="M 68 60 C 95 85, 115 130, 92 205" stroke="#48240a" stroke-width="1.8" stroke-opacity="0.35" fill="none"/>
  <path d="M 65 95 C 88 115, 102 150, 86 215" stroke="#48240a" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
  <path d="M 72 40 C 105 70, 122 120, 98 190" stroke="#48240a" stroke-width="1.5" stroke-opacity="0.25" fill="none"/>
  
  <!-- 微細木眼心 -->
  <ellipse cx="88" cy="140" rx="3" ry="5" fill="#48240a" fill-opacity="0.4"/>

  </g>
</svg>