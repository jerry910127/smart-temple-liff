<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <!-- 左筊：正面 (凸/陽面，朱紅色) -->
  <g transform="translate(10, -10) rotate(-22 100 110)">
    <defs>
      <!-- 正面：宮廟硃砂紅漆木質漸層 -->
      <linearGradient id="cypressWood" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F14D4F"/>
        <stop offset="25%" stop-color="#CF2429"/>
        <stop offset="65%" stop-color="#991419"/>
        <stop offset="100%" stop-color="#58090C"/>
      </linearGradient>
      <!-- 圓弧立體漆器高光 -->
      <linearGradient id="ridgeHighlight" x1="30%" y1="0%" x2="70%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
        <stop offset="35%" stop-color="#ffb8b8" stop-opacity="0.25"/>
        <stop offset="70%" stop-color="#7f0e13" stop-opacity="0.1"/>
        <stop offset="100%" stop-color="#330406" stop-opacity="0.45"/>
      </linearGradient>
      <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
        <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#2d0608" flood-opacity="0.45"/>
      </filter>
    </defs>

    <!-- 凸面半月筊身 (正面朱紅) -->
    <path d="M 80 15 
             C 135 45, 145 150, 105 235 
             C 95 250, 80 252, 75 238 
             C 50 170, 48 85, 80 15 Z" 
          fill="url(#cypressWood)" 
          filter="url(#softShadow)"/>

    <!-- 筊背立體脊線與紅漆高光 -->
    <path d="M 80 15 
             C 118 60, 120 160, 90 236
             C 85 240, 78 238, 75 230
             C 60 160, 62 80, 80 15 Z" 
          fill="url(#ridgeHighlight)"/>

    <!-- 硃砂漆年輪微細紋理 -->
    <path d="M 75 45 C 105 70, 115 120, 95 180" stroke="#4a080a" stroke-width="1.2" stroke-opacity="0.3" fill="none"/>
    <path d="M 70 80 C 95 105, 105 145, 90 195" stroke="#4a080a" stroke-width="1.2" stroke-opacity="0.25" fill="none"/>
    <path d="M 78 30 C 95 50, 102 90, 88 140" stroke="#ffc2c4" stroke-width="1.2" stroke-opacity="0.3" fill="none"/>
  </g>

  <!-- 右筊：陰面 (平/剖面，咖啡色) -->
  <g transform="translate(145, 10) rotate(35 100 110)">
    <defs>
      <!-- 陰面：內斂厚實咖啡色木質切面 -->
      <linearGradient id="flatWood" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#A57347"/>
        <stop offset="45%" stop-color="#7B4C26"/>
        <stop offset="100%" stop-color="#4F2B13"/>
      </linearGradient>
      <radialGradient id="innerShade" cx="50%" cy="50%" r="50%">
        <stop offset="60%" stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#261307" stop-opacity="0.38"/>
      </radialGradient>
      <filter id="softShadow2" x="-15%" y="-15%" width="130%" height="130%">
        <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#241205" flood-opacity="0.45"/>
      </filter>
    </defs>

    <!-- 平切半月身 (陰面咖啡色) -->
    <path d="M 80 15 
             C 135 45, 145 150, 105 235 
             C 95 250, 80 252, 75 238 
             C 50 170, 48 85, 80 15 Z" 
          fill="url(#flatWood)" 
          filter="url(#softShadow2)"/>

    <!-- 剖面內斂邊緣陰影 (表現平整切面) -->
    <path d="M 80 15 
             C 135 45, 145 150, 105 235 
             C 95 250, 80 252, 75 238 
             C 50 170, 48 85, 80 15 Z" 
          fill="url(#innerShade)"/>

    <!-- 咖啡木質同心年輪微紋 -->
    <path d="M 68 60 C 95 85, 115 130, 92 205" stroke="#3A1C08" stroke-width="1.8" stroke-opacity="0.38" fill="none"/>
    <path d="M 65 95 C 88 115, 102 150, 86 215" stroke="#3A1C08" stroke-width="1.5" stroke-opacity="0.32" fill="none"/>
    <path d="M 72 40 C 105 70, 122 120, 98 190" stroke="#3A1C08" stroke-width="1.5" stroke-opacity="0.25" fill="none"/>
    
    <!-- 木心眼 -->
    <ellipse cx="88" cy="140" rx="3" ry="5" fill="#301505" fill-opacity="0.5"/>
  </g>
</svg>