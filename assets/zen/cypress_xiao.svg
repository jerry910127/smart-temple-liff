<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <!-- 左筊：凸面 (陽) -->
  <g transform="translate(20, -5) rotate(-28 100 110)">
    <defs>
      <!-- 宮廟硃砂紅漆木質漸層 -->
      <linearGradient id="cypressWood" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F14D4F"/>
        <stop offset="25%" stop-color="#CF2429"/>
        <stop offset="65%" stop-color="#991419"/>
        <stop offset="100%" stop-color="#58090C"/>
      </linearGradient>
      <!-- 圓弧立體漆器高光 -->
      <linearGradient id="ridgeHighlight" x1="30%" y1="0%" x2="70%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
        <stop offset="35%" stop-color="#ffb8b8" stop-opacity="0.25"/>
        <stop offset="70%" stop-color="#7f0e13" stop-opacity="0.1"/>
        <stop offset="100%" stop-color="#330406" stop-opacity="0.45"/>
      </linearGradient>
      <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
        <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#2d0608" flood-opacity="0.45"/>
      </filter>
    </defs>

    <!-- 凸面半月筊身 -->
    <path d="M 80 15 
             C 135 45, 145 150, 105 235 
             C 95 250, 80 252, 75 238 
             C 50 170, 48 85, 80 15 Z" 
          fill="url(#cypressWood)" 
          filter="url(#softShadow)"/>

    <!-- 筊背立體脊線與紅漆高光 -->
    <path d="M 80 15 
             C 118 60, 120 160, 90 236
             C 85 240, 78 238, 75 230
             C 60 160, 62 80, 80 15 Z" 
          fill="url(#ridgeHighlight)"/>

    <!-- 硃砂漆木年輪微細紋理 -->
    <path d="M 75 45 C 105 70, 115 120, 95 180" stroke="#4a080a" stroke-width="1.2" stroke-opacity="0.3" fill="none"/>
    <path d="M 70 80 C 95 105, 105 145, 90 195" stroke="#4a080a" stroke-width="1" stroke-opacity="0.25" fill="none"/>
    <path d="M 78 30 C 95 50, 102 90, 88 140" stroke="#ffc2c4" stroke-width="1.2" stroke-opacity="0.3" fill="none"/>
  </g>

  <!-- 右筊：凸面 (陽) -->
  <g transform="translate(140, 15) rotate(30 100 110)">
    <defs>
      <!-- 宮廟硃砂紅漆木質漸層 -->
      <linearGradient id="cypressWood2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F14D4F"/>
        <stop offset="25%" stop-color="#CF2429"/>
        <stop offset="65%" stop-color="#991419"/>
        <stop offset="100%" stop-color="#58090C"/>
      </linearGradient>
      <!-- 圓弧立體漆器高光 -->
      <linearGradient id="ridgeHighlight2" x1="30%" y1="0%" x2="70%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
        <stop offset="35%" stop-color="#ffb8b8" stop-opacity="0.25"/>
        <stop offset="70%" stop-color="#7f0e13" stop-opacity="0.1"/>
        <stop offset="100%" stop-color="#330406" stop-opacity="0.45"/>
      </linearGradient>
      <filter id="softShadow_r" x="-15%" y="-15%" width="130%" height="130%">
        <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#2d0608" flood-opacity="0.45"/>
      </filter>
    </defs>

    <!-- 凸面半月筊身 -->
    <path d="M 80 15 
             C 135 45, 145 150, 105 235 
             C 95 250, 80 252, 75 238 
             C 50 170, 48 85, 80 15 Z" 
          fill="url(#cypressWood2)" 
          filter="url(#softShadow_r)"/>

    <!-- 筊背立體脊線與紅漆高光 -->
    <path d="M 80 15 
             C 118 60, 120 160, 90 236
             C 85 240, 78 238, 75 230
             C 60 160, 62 80, 80 15 Z" 
          fill="url(#ridgeHighlight2)"/>

    <!-- 硃砂漆木年輪微細紋理 -->
    <path d="M 75 45 C 105 70, 115 120, 95 180" stroke="#4a080a" stroke-width="1.2" stroke-opacity="0.3" fill="none"/>
    <path d="M 70 80 C 95 105, 105 145, 90 195" stroke="#4a080a" stroke-width="1" stroke-opacity="0.25" fill="none"/>
    <path d="M 78 30 C 95 50, 102 90, 88 140" stroke="#ffc2c4" stroke-width="1.2" stroke-opacity="0.3" fill="none"/>
  </g>
</svg>