services:
  - type: web
    name: smart-temple-webhook
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: LINE_LOGIN_CHANNEL_IDS
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://jerry910127.github.io
      - key: ADMIN_LOG_TOKEN
        generateValue: true
      - key: QUEST_ACCESS_CODE_HASHES
        sync: false
