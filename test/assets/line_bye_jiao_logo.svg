<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 65" fill="none">
  <defs>
    <!-- 柔和立體下投影 -->
    <filter id="jiaoLipShadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="rgba(107, 10, 13, 0.45)"/>
    </filter>
  </defs>

  <!-- 步驟 1：建立筊杯底座外輪廓（微笑半月形/船形底座，朱砂暗紅 #981617） -->
  <path d="M 12 16.5 
           C 25 21.5, 75 21.5, 88 16.5 
           C 91.5 18, 92 21.5, 89.5 26.5 
           C 85 46, 70 58.5, 50 58.5 
           C 30 58.5, 15 46, 10.5 26.5 
           C 8 21.5, 8.5 18, 12 16.5 Z" 
        fill="#981617" 
        filter="url(#jiaoLipShadow)"/>

  <!-- 步驟 2：繪製上方內凹陰影區（營造厚度與景深，宮廟深緋紅 #6B0A0D） -->
  <path d="M 15 18.5 
           C 27 23, 73 23, 85 18.5 
           C 82.5 39, 68 45.5, 50 45.5 
           C 32 45.5, 17.5 39, 15 18.5 Z" 
        fill="#6B0A0D"/>

  <!-- 步驟 3：排版與刻劃 BYE 文字（典雅金棕 #C68F42，無襯線大器置中） -->
  <text x="50" y="36.5" 
        font-size="14" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" 
        font-weight="900" 
        fill="#C68F42" 
        letter-spacing="0.8px" 
        text-anchor="middle">BYE</text>

  <!-- 步驟 4：疊加底部月牙高光（微笑反光亮面，豆沙肉粉 #C97779，中間厚兩端收細，88% 透明度） -->
  <path d="M 23.5 39.5 
           C 30.5 50.5, 39.5 54, 50 54 
           C 60.5 54, 69.5 50.5, 76.5 39.5 
           C 68.5 48.5, 59.5 51.5, 50 51.5 
           C 40.5 51.5, 31.5 48.5, 23.5 39.5 Z" 
        fill="#C97779" 
        opacity="0.88"/>
</svg>
